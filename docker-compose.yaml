services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: hopper-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hopper-audit
    ports:
      - "5433:5432"

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid

  redis:
    image: redis:7
    container_name: hopper-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data:/data
    
  
    

volumes:
  postgres_data: {}
    